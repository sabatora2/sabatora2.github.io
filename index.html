<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>バス時刻表</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3448/3448339.png">

    <style>
        body { font-family: -apple-system, sans-serif; background-color: #f2f2f7; margin: 0; padding-top: env(safe-area-inset-top); display: flex; justify-content: center; }
        .card { background: white; width: 100%; max-width: 400px; min-height: 100vh; padding: 0; box-sizing: border-box; position: relative; }
        
        .header { background-color: #00479d; padding: 20px; border-radius: 0; }
        
        /* タイトルとアイコンのコンテナ */
        .title-container { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin-bottom: 15px;
            color: white;
        }
        
        /* バス停アイコン（SVG） */
        .bus-icon {
            width: 24px;
            height: 24px;
            margin-right: 8px;
            fill: currentColor;
        }

        h1 { font-size: 1.4rem; color: #ffffff; margin: 0; }
        
        .content-body { padding: 0 20px; position: relative; }

        .select-wrapper { position: relative; margin-bottom: 5px; }
        select {
            width: 100%; padding: 12px; font-size: 1rem; border-radius: 10px; border: none;
            background-color: #fff; appearance: none; -webkit-appearance: none; font-weight: 600; color: #00479d;
        }
        .select-wrapper::after { content: '▼'; position: absolute; right: 15px; top: 15px; font-size: 0.8rem; color: #8e8e93; pointer-events: none; }
        
        .bus-list { list-style: none; padding: 0; margin: 0; }
        .bus-item { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 0.5px solid #d1d1d6; }
        .time { font-size: 2.2rem; font-weight: 700; color: #00479d; letter-spacing: -1px; }
        
        .countdown { 
            background: #007aff; color: white; padding: 8px 0; border-radius: 10px; 
            font-size: 1rem; font-weight: 600; min-width: 100px; text-align: center; display: inline-block;
        }
        
        .toggle-btn-container { text-align: right; margin-top: 15px; }
        #holiday-toggle {
            background-color: #e5e5ea; color: #3a3a3c; border: none; padding: 8px 15px;
            border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        #holiday-toggle.active { background-color: #ff3b30; color: white; }

        .status { font-size: 0.8rem; color: #8e8e93; margin-top: 15px; text-align: center; padding-bottom: 20px; }
        .finished { text-align: center; padding: 40px 0; color: #ff3b30; font-weight: bold; }
    </style>
</head>

let isHolidayForced = false;

function toggleHolidayMode() {
    isHolidayForced = !isHolidayForced;
    const btn = document.getElementById('holiday-toggle');
    if (isHolidayForced) {
        btn.innerText = "自動ダイヤに戻す";
        btn.classList.add('active');
    } else {
        btn.innerText = "休日ダイヤに切替";
        btn.classList.remove('active');
    }
    updateBusTimes();
}

function changeStation() {
    const select = document.getElementById('destination-select');
    const stationTitle = select.options[select.selectedIndex].parentNode.label;
    document.getElementById('station-name').innerText = stationTitle;
    updateBusTimes();
}

function updateBusTimes() {
    const dest = document.getElementById('destination-select').value;
    const now = new Date();
    const day = now.getDay(); 
    const currentNum = now.getHours() * 100 + now.getMinutes();
    
    let schedule;
    let dayLabel;

    if (isHolidayForced) {
        schedule = data[dest].holiday;
        dayLabel = "日曜・祝日（固定）";
    } else {
        schedule = (day === 0) ? data[dest].holiday : (day === 6 ? data[dest].saturday : data[dest].weekday);
        dayLabel = (day === 0) ? "日曜・祝日" : (day === 6 ? "土曜" : "平日");
    }

    const upcoming = schedule.filter(timeStr => {
        const [h, m] = timeStr.split(':').map(Number);
        return (h * 100 + m) > currentNum;
    }).slice(0, 3);

    const display = document.getElementById('bus-display');
    display.innerHTML = '';
    
    if (upcoming.length === 0) {
        display.innerHTML = '<li class="finished">本日の運行は終了しました</li>';
    } else {
        upcoming.forEach(time => {
            const [h, m] = time.split(':').map(Number);
            const busDate = new Date();
            busDate.setHours(h, m, 0);
            const diffMin = Math.floor((busDate - now) / 60000);
            display.innerHTML += `
                <li class="bus-item">
                    <span class="time">${time}</span>
                    <span class="countdown">あと ${diffMin} 分</span>
                </li>
            `;
        });
    }
    const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
    document.getElementById('date-info').innerText = `現在: ${timeStr} (${dayLabel}ダイヤ)`;
}

updateBusTimes();
setInterval(updateBusTimes, 10000);
</script>
